name: Build Android app

# Runs on every push to main, and from the Actions tab with "Run workflow".
# All build steps live in ci/build.sh inside noor_salon.zip, so updates only need a new zip.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack app code
        run: |
          if [ -f noor_salon.zip ]; then
            unzip -q -o noor_salon.zip -d /tmp/src
            cp -r /tmp/src/noor_salon/. .
          fi

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RUN: ${{ github.run_number }}
        run: bash ci/build.sh

      - name: Keep APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: NoorSalon-apk
          path: NoorSalon-*.apk

      - name: Publish to Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Noor Salon ${{ env.APK_MODE }} build ${{ github.run_number }}
          body: Open this page on your Android phone, download the .apk file below and open it to install.
          files: NoorSalon-*.apk
